# Quick checks of the release pipeline, in seconds and without building Rust:
# workflow syntax, the packaging scripts (shell and PowerShell), the Windows
# installer and macOS Info.plist XML, and the Linux desktop entry and
# AppStream metadata.
name: Packaging lint

on:
  push:
    branches: [main]
    paths: [".github/workflows/**", "packaging/**", "scripts/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils appstream libxml2-utils
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/actionlint.tar.gz" actionlint

      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

      - name: shellcheck
        run: shellcheck packaging/env.sh packaging/*/*.sh scripts/*.sh

      - name: PowerShell
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem packaging/windows/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Output "::error file=$($file.Name)::$_" }; exit 1 }
            Write-Output "ok $($file.Name)"
          }

      - name: Installer, Info.plist, desktop entry and AppStream metadata
        run: |
          xmllint --noout packaging/windows/*.wxs packaging/macos/Info.plist.in packaging/linux/*.xml.in
          if [ "$(grep -oiE '(UpgradeCode|Guid)="[0-9A-F-]{36}"' packaging/windows/*.wxs | cut -d'"' -f2 | sort -f | uniq -di)" ]; then
            echo "::error::duplicate GUID in the WiX source"; exit 1
          fi
          desktop-file-validate packaging/linux/*.desktop
          sed -e 's/@VERSION@/0.0.0/' -e 's/@DATE@/2026-01-01/' \
            packaging/linux/org.oxyapps.oxypad.metainfo.xml.in >"$RUNNER_TEMP/org.oxyapps.oxypad.metainfo.xml"
          appstreamcli validate --no-net --explain "$RUNNER_TEMP/org.oxyapps.oxypad.metainfo.xml"
