name: Release

# Pushing a tag such as v0.1.0 builds OxyPad for macOS (Apple silicon and
# Intel DMGs), Windows (x64, ARM64: MSI and portable zip) and Linux (x86_64,
# aarch64: AppImage, deb, rpm, tar.gz), installs the Windows ARM64 MSI on an
# ARM64 machine to check it, and publishes a GitHub Release with every file.
# The tag must match the version in Cargo.toml, and CHANGELOG.md must have a
# "## [X.Y.Z]" section, used as the release notes. Running it by hand from
# the Actions tab builds and checks everything without publishing; the files
# are kept as workflow artifacts.
#
# Each platform's packaging is a script in packaging/ that also runs locally:
#   packaging/macos/package.sh --arch apple-silicon|intel
#   packaging/windows/package.ps1 -Arch x64|arm64
#   packaging/linux/package.sh
#
# macOS signing and notarization are optional. Without these repository
# secrets the app is signed ad hoc and the release notes explain how to open it:
#   DEVELOPER_ID_CERTIFICATE_P12       base64 of the "Developer ID Application" .p12
#   DEVELOPER_ID_CERTIFICATE_PASSWORD  password of that .p12
#   DEVELOPER_ID_APPLICATION           identity, e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_TEAM_ID                      Team ID
#   APPLE_ID, APPLE_APP_PASSWORD       Apple ID and app-specific password for notarytool

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          # shellcheck source=packaging/env.sh
          . packaging/env.sh
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in Cargo.toml"
              exit 1
            fi
            if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS DMGs
    needs: version
    # Both DMGs come from one Apple silicon runner (Intel is cross-compiled):
    # macOS minutes are the expensive ones.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: packaging/macos/import-cert.sh

      - name: Build, sign and notarize the DMGs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          packaging/macos/package.sh --arch apple-silicon
          packaging/macos/package.sh --arch intel

      - uses: actions/upload-artifact@v4
        with:
          name: oxypad-macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          # Cross-compiled on x64 with Visual Studio's ARM64 tools.
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build and package
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}

      # Two downloads: the installer and the portable zip.
      - uses: actions/upload-artifact@v4
        with:
          name: oxypad-windows-${{ matrix.arch }}-installer
          path: dist/*.msi*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: oxypad-windows-${{ matrix.arch }}-portable
          path: dist/*-portable.zip*
          if-no-files-found: error

  windows-arm64-install:
    name: Windows ARM64 install check
    needs: windows
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oxypad-windows-arm64-installer
          path: dist
      - name: Install the MSI, check and run OxyPad, uninstall it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "msiexec /i exited $($p.ExitCode)" }

          $exe = Join-Path $env:ProgramFiles 'OxyPad\OxyPad.exe'
          if (-not (Test-Path $exe)) { throw "OxyPad.exe not installed at $exe" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
          if ($machine -ne 0xAA64) { throw "OxyPad.exe is for machine 0x$('{0:X}' -f $machine), not ARM64" }
          Write-Output "ok $exe (ARM64)"
          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\OxyPad.lnk'
          if (-not (Test-Path $shortcut)) { throw "no Start menu shortcut at $shortcut" }
          Write-Output 'ok Start menu shortcut'

          # A GUI app: no console output to read, but it must start and exit cleanly.
          $run = Start-Process $exe -ArgumentList '--version' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "OxyPad.exe --version exited $($run.ExitCode)" }
          Write-Output 'ok OxyPad.exe --version'

          $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited $($p.ExitCode)" }
          if (Test-Path $exe) { throw 'uninstall left OxyPad.exe behind' }
          Write-Output 'ok uninstalled'

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # The oldest supported Ubuntu: the binary needs a glibc at least as old as the build host's.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64, nfpm-sha256: 787af76e172dd5fc7cedf4d7c5a090a2f62be9001557a4db1103e270f90ddefd }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64, nfpm-sha256: 8e9cd8b4ed372a5e8af555a997dfe5e111cb6c7d4d757fd0a0368a35ad84a9b0 }
    env:
      NFPM_VERSION: 2.48.0
    steps:
      - uses: actions/checkout@v4
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev \
            desktop-file-utils appstream
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_${{ matrix.deb }}.deb"
          echo "${{ matrix.nfpm-sha256 }}  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}

      - name: Build and package (AppImage, deb, rpm, tar.gz)
        run: packaging/linux/package.sh

      - name: Check the packages
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -E 'usr/bin/|metainfo|applications'
          for appimage in dist/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
          done
          ldd target/release/oxypad

      - uses: actions/upload-artifact@v4
        with:
          name: oxypad-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, macos, windows, windows-arm64-install, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        run: |
          # The CHANGELOG section for this version, without its heading.
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]*\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Download"
            echo
            echo "| Computer | Download |"
            echo "|---|---|"
            echo "| Mac with Apple silicon (M1 or later) | **OxyPad-$VERSION-macos-apple-silicon.dmg** |"
            echo "| Mac with an Intel processor | **OxyPad-$VERSION-macos-intel.dmg** |"
            echo "| Windows (most PCs) | **OxyPad-$VERSION-windows-x64.msi** (installer) or **OxyPad-$VERSION-windows-x64-portable.zip** |"
            echo "| Windows on ARM (Snapdragon, …) | **OxyPad-$VERSION-windows-arm64.msi** (installer) or **OxyPad-$VERSION-windows-arm64-portable.zip** |"
            echo "| Linux (most PCs) | **OxyPad-$VERSION-linux-x86_64.AppImage**, or the .deb, .rpm or .tar.gz |"
            echo "| Linux on ARM64 | **OxyPad-$VERSION-linux-aarch64.AppImage**, or the .deb, .rpm or .tar.gz |"
            echo
            echo "**macOS:** open the DMG and drag OxyPad to Applications. Apple menu ▸ About This Mac"
            echo "shows *Chip* (Apple silicon) or *Processor* (Intel). Requires macOS 11 or later."
            if [[ "$HAS_SIGNING" != "true" ]]; then
              echo
              echo "This build is not notarized by Apple yet. The first time, macOS will refuse to open it:"
              echo "open **System Settings ▸ Privacy & Security** and click **Open Anyway** next to OxyPad,"
              # shellcheck disable=SC2016 # literal backticks for Markdown
              echo 'or run `xattr -dr com.apple.quarantine /Applications/OxyPad.app` in Terminal.'
            fi
            echo
            echo "**Windows:** the MSI installs OxyPad for all users, with a Start menu shortcut and an"
            echo "entry under *Open with* for text and code files. The portable zip needs no installation: unzip it"
            echo "and run OxyPad.exe. Windows SmartScreen may warn the first time, as OxyPad is not signed"
            echo "yet: choose **More info ▸ Run anyway**."
            echo
            echo "**Linux:** the AppImage runs on any distribution: make it executable"
            # shellcheck disable=SC2016 # literal backticks for Markdown
            echo '(`chmod +x OxyPad-*.AppImage`) and open it. The .deb (Debian, Ubuntu, Mint) and .rpm'
            # shellcheck disable=SC2016 # literal backticks for Markdown
            echo '(Fedora, openSUSE) install OxyPad system-wide: `sudo apt install ./OxyPad-*.deb` or'
            # shellcheck disable=SC2016 # literal backticks for Markdown
            echo '`sudo dnf install ./OxyPad-*.rpm`. Needs glibc 2.35 or later (Ubuntu 22.04, Debian 12, Fedora 36).'
          } >> notes.md
          ls -l dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OxyPad $VERSION" \
            --notes-file notes.md \
            --verify-tag
