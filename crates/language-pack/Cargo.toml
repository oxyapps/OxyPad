[package]
name = "oxypad-language-pack"
description = "Builds OxyPad's additional language pack: Tree-sitter grammars as shared libraries plus their highlight queries."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde_json.workspace = true

# The grammars in the pack, pinned to the versions gpui-component uses so the
# queries match. They are dependencies only to put their sources in the
# workspace's `cargo metadata`; the tool compiles them into shared libraries.
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-elixir = "=0.3.5"
tree-sitter-kotlin-sg = "=0.4.1"
tree-sitter-php = "=0.24.2"
tree-sitter-ruby = "=0.23.1"
tree-sitter-scala = "=0.23.4"
tree-sitter-swift = "=0.7.4"
tree-sitter-zig = "=1.1.2"
