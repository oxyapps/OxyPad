# Texts of the gpui-kit components OxyPad uses (editor context menu, find
# bar, Settings search). Ours take precedence over gpui-kit's own, so they
# don't depend on gpui-kit having the language. Keys are gpui-kit's.
gpui_component:
  Input:
    Cut: Cut
    Copy: Copy
    Paste: Paste
    Select All: Select All
    Replace: Replace
    Replace All: Replace All
    Clear: Clear
    Increment: Increment
    Decrement: Decrement
    Show Password: Show password
    Hide Password: Hide password
    Go to Definition: Go to Definition
    Show Code Actions: Show Code Actions
  Settings:
    search_placeholder: Search...
    Reset All: Reset All
  Dialog:
    ok: OK
    cancel: Cancel
