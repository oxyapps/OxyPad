[package]
name = "oxypad"
description = "A fast, native, cross-platform text editor with tabs, session restore and a tail -f log mode."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oxypad"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
anyhow.workspace = true
dirs.workspace = true
gpui-kit = "=0.8.0"
oxypad-core.workspace = true
oxypad-session.workspace = true
oxypad-syntax.workspace = true
oxypad-tail.workspace = true
# The editor's text type, at the version gpui-kit uses, for its line index.
ropey = { version = "=2.0.0-beta.1", default-features = false, features = ["metric_lines_lf"] }
# The same i18n runtime as gpui-kit, so one locale switch covers both.
rust-i18n = "4.2"
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
