# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm does not expand variables in `src`)
# and exports VERSION and NFPM_ARCH.
name: oxypad
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: editors
priority: optional
maintainer: ${OXYPAD_MAINTAINER}
vendor: OxyApps
homepage: https://github.com/oxyapps/OxyPad
license: Apache-2.0
description: |-
  Fast, native text editor with tabs, sessions and a tail -f log mode.
  Syntax highlighting and folding for 40 languages, find and replace,
  side-by-side comparison, and a read-only log mode that follows files
  through truncation and rotation.

# The windowing (X11, Wayland, xkbcommon), fonts (fontconfig, FreeType) and the GPU (Vulkan)
# libraries, some of them loaded at run time rather than linked.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libfontconfig1
      - libfreetype6
      - libvulkan1
    recommends:
      - libwayland-client0
      - libx11-xcb1
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    depends:
      - libxkbcommon
      - libxkbcommon-x11
      - fontconfig
      - freetype
      - vulkan-loader
    recommends:
      - libwayland-client
      - libX11-xcb
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/oxypad
    dst: /usr/bin/oxypad
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
